# Movate Agent Assurance — sample config.
# CLI flags override fields here.

dataset: datasets/sample.jsonl
output_dir: ./results
runs_per_scenario: 3
concurrency: 4
judges_enabled: true
pdf: true
client_name: "Acme Industries"
confidentiality_footer: "Confidential — prepared by Movate Agent Assurance for Acme Industries."

adapter:
  target: rest
  endpoint: https://api.example.com/agent/invoke
  api_key_env: AGENT_API_KEY
  headers:
    Content-Type: application/json
  request_template:
    input: "{{input}}"
  response_text_path: "$.response"
  response_tools_path: "$.tool_calls"
  response_workflow_path: "$.workflow_path"
  timeout_s: 60.0
  max_retries: 2

judges:
  enabled_roles: [correctness, grounding, completeness, tool_usage, ux_tone]
  panel:
    - { provider: openai,    model: gpt-4o-mini,                temperature: 0.0 }
    - { provider: anthropic, model: claude-haiku-4-5-20251001,  temperature: 0.0 }
  meta_judge: { provider: anthropic, model: claude-sonnet-4-6, temperature: 0.0 }
  arbitration_variance_threshold: 0.04
  deepeval_metrics: [g_eval, task_completion, hallucination, answer_relevance]
